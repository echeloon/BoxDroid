plugins {
    id 'com.android.application'
}

android {
    namespace 'org.boxdroid.m0probe'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'org.boxdroid.m0probe'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror=return-type'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }
}
