plugins {
    id 'com.android.application'
}

def nativeBuildRoot = providers.gradleProperty('nativeBuildRoot').orNull
if (nativeBuildRoot == null) {
    throw new GradleException('Pass -PnativeBuildRoot=<BoxDroid Android native build directory>')
}

android {
    namespace 'org.boxdroid'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'org.boxdroid'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["${nativeBuildRoot}/jniLibs"]
            assets.srcDirs += ["${nativeBuildRoot}/assets"]
        }
    }

    packaging { jniLibs { useLegacyPackaging = true } }

    buildTypes {
        debug { debuggable true; jniDebuggable true }
        release { minifyEnabled false }
    }
}
