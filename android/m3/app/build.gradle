plugins {
    id 'com.android.application'
}

def m3BuildRoot = providers.gradleProperty('m3BuildRoot').orNull
if (m3BuildRoot == null) {
    throw new GradleException('Pass -Pm3BuildRoot=<BoxDroid build/m3 directory>')
}

android {
    namespace 'org.boxdroid.m3'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'org.boxdroid.m3'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["${m3BuildRoot}/jniLibs"]
            assets.srcDirs = ["${m3BuildRoot}/assets"]
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release { minifyEnabled false }
    }
}
